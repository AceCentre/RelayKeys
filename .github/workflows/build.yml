on:
  workflow_dispatch:
  push:
    branches:
      - main
      - go
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.23'
    - run: go vet ./...
    - run: go test ./... -count=1

  build:
    runs-on: windows-latest
    needs: lint
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Install NSIS
      run: |
        choco install nsis -y
        Invoke-WebRequest -Uri 'https://nsis.sourceforge.io/mediawiki/images/e/ef/NSIS_Simple_Service_Plugin_Unicode_1.30.zip' -OutFile ss.zip
        Expand-Archive ss.zip -DestinationPath ss
        Copy-Item ss\SimpleSC.dll "C:\Program Files (x86)\NSIS\Plugins\x86-unicode\"

    - name: Build
      run: powershell -ExecutionPolicy Bypass -File build-go.ps1

    - name: Upload installer
      uses: actions/upload-artifact@v4
      with:
        name: 'Windows Installer'
        path: 'RelayKeys-*.exe'

    - name: Upload binaries
      uses: actions/upload-artifact@v4
      with:
        name: 'Windows Binaries'
        path: 'build-go/*.exe'
