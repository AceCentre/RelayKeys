name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-go@v6
      with:
        go-version: '1.23'
    - run: go vet ./...
    - run: go test ./... -count=1

  build-windows:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    needs: lint
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-go@v6
      with:
        go-version: '1.23'

    - name: Install NSIS
      run: |
        choco install nsis -y
        Invoke-WebRequest -Uri 'https://nsis.sourceforge.io/mediawiki/images/e/ef/NSIS_Simple_Service_Plugin_Unicode_1.30.zip' -OutFile ss.zip
        Expand-Archive ss.zip -DestinationPath ss
        Copy-Item ss\SimpleSC.dll "C:\Program Files (x86)\NSIS\Plugins\x86-unicode\"

    - name: Build
      env:
        VERSION: ${{ github.ref_name }}
      run: powershell -ExecutionPolicy Bypass -File build-go.ps1

    - name: Upload artifacts
      uses: actions/upload-artifact@v5
      with:
        name: windows-binaries
        path: |
          build-go/*.exe
          RelayKeys-*.exe

  build-macos:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    needs: lint
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-go@v6
      with:
        go-version: '1.23'

    - name: Build binaries
      env:
        VERSION: ${{ github.ref_name }}
      run: bash build-go.sh macos

    - name: Build macOS app bundle
      env:
        VERSION: ${{ github.ref_name }}
      run: bash build-macos-app.sh

    - name: Create macOS ZIP archive
      env:
        VERSION: ${{ github.ref_name }}
      run: |
        VERSION=${VERSION#v}
        STAGING="RelayKeys-macOS-staging"
        rm -rf "$STAGING"
        mkdir -p "$STAGING"
        cp -r build-go/RelayKeys.app "$STAGING/"
        cp build-go/relaykeys-daemon build-go/relaykeys-cli "$STAGING/"
        cp -r keymaps macros "$STAGING/"
        cp examples/relaykeys-example.cfg "$STAGING/"
        cp macos/com.acecentre.relaykeys.plist "$STAGING/"
        zip -r "RelayKeys-${VERSION}-macOS.zip" "$STAGING"
        rm -rf "$STAGING"

    - name: Upload artifacts
      uses: actions/upload-artifact@v5
      with:
        name: macos-binaries
        path: |
          build-go/relaykeys-daemon
          build-go/relaykeys-cli
          build-go/relaykeys-menubar
          RelayKeys-*.zip

  build-firmware:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v5

    - name: Install Arduino CLI
      run: |
        curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh -s
        sudo mv bin/arduino-cli /usr/local/bin/

    - name: Setup Arduino CLI
      run: |
        arduino-cli config init
        arduino-cli config add board_manager.additional_urls https://adafruit.github.io/arduino-board-index/package_adafruit_index.json
        arduino-cli core update-index
        arduino-cli core install adafruit:nrf52
        arduino-cli lib install TimedBlink "Adafruit NeoPixel" "Adafruit DotStar"
        pip3 install adafruit-nrfutil

    - name: Copy common header into sketch dirs
      run: cp arduino/common/relaykeys_common.h arduino/arduino_nRF52840/

    - name: Download uf2conv.py
      run: |
        curl -fsSL -o uf2conv.py https://raw.githubusercontent.com/microsoft/uf2/master/utils/uf2conv.py
        curl -fsSL -o uf2families.json https://raw.githubusercontent.com/microsoft/uf2/master/utils/uf2families.json

    - name: Build all firmware variants
      run: bash build-firmware.sh

    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v5
      with:
        name: firmware-uf2
        path: firmware/*.UF2

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos, build-firmware]
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v5
      with:
        path: artifacts

    - name: List artifacts
      run: find artifacts -type f | sort

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: |
          artifacts/windows-binaries/*
          artifacts/macos-binaries/*
          artifacts/firmware-uf2/*
